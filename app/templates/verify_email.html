<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-192.png">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>RestOS — {{ _("Подтверждение email") }}</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/main.css?v=18">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-serif">Rest</span><span class="logo-mono">OS</span>
      </div>
      {% if ok %}
        <p class="auth-subtitle" style="color:var(--ok)">{{ _("Email подтверждён") }}</p>
      {% else %}
        <p class="auth-subtitle" style="color:var(--bad)">{{ _("Ссылка недействительна или устарела") }}</p>
      {% endif %}
      <a href="/dashboard" class="btn-primary btn-full" style="display:block; text-align:center; text-decoration:none; margin-top:1rem">{{ _("В панель управления") }}</a>
    </div>
  </div>
</body>
</html>
