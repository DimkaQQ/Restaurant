<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-192.png">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>{{ _("RestOS — Восстановление пароля") }}</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/main.css?v=17">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-serif">Rest</span><span class="logo-mono">OS</span>
      </div>
      <p class="auth-subtitle">{{ _("Восстановление пароля") }}</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>
      <div id="ok-msg" class="save-result ok" style="display:none; margin-bottom:1rem"></div>

      <form id="fp-form" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" name="email" placeholder="owner@restaurant.kz" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary btn-full">{{ _("Отправить ссылку для сброса") }}</button>
      </form>
      <p class="auth-subtitle" style="margin-top:1rem">
        <a href="/auth/login" style="color:var(--gold)">{{ _("Назад ко входу") }}</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('fp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error-msg');
      const ok = document.getElementById('ok-msg');
      err.style.display = 'none';
      ok.style.display = 'none';
      const res = await fetch('/auth/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      if (res.ok) {
        ok.textContent = {{ _("Если такой email зарегистрирован, мы отправили ссылку для сброса пароля.") | tojson }};
        ok.style.display = 'block';
        document.getElementById('fp-form').reset();
      } else {
        err.textContent = {{ _("Ошибка отправки. Попробуйте позже.") | tojson }};
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
