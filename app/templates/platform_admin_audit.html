<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал администратора — RestOS</title>
  <link rel="stylesheet" href="/static/css/main.css?v=7">
  <style>
    body { background:var(--black); padding:2rem; font-family:'Inter',sans-serif; }
    h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:1.8rem; margin-bottom:.5rem; }
    .top-nav { margin-bottom:1.5rem; }
    .top-nav a { color:var(--muted); font-size:.82rem; text-decoration:none; }
    .top-nav a:hover { color:var(--gold); }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:.6rem .9rem; font-size:.85rem; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); text-transform:uppercase; font-size:.7rem; letter-spacing:.04em; }
    tr:last-child td { border-bottom:none; }
    .action-pill { padding:.15rem .55rem; border-radius:12px; font-size:.72rem; font-weight:600; background:rgba(200,168,75,.15); color:var(--gold); }
    .empty { color:var(--muted); padding:2rem; text-align:center; }
  </style>
</head>
<body>
  <h1>Журнал действий администратора</h1>
  <div class="top-nav"><a href="/platform/admin">← Назад к панели</a></div>

  {% if entries %}
  <table>
    <thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Детали</th></tr></thead>
    <tbody>
      {% for e in entries %}
      <tr>
        <td>{{ e.created_at.strftime('%d.%m.%Y %H:%M') }}</td>
        <td>{{ e.admin_email }}</td>
        <td><span class="action-pill">{{ e.action }}</span></td>
        <td>{{ e.detail or '—' }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="empty">Записей пока нет.</div>
  {% endif %}
</body>
</html>
