<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-192.png">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>{{ _("RestOS — Вход") }}</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/main.css?v=14">
  <style>.lang-switch { text-align:center; font-size:.78rem; margin-bottom:.75rem; }
    .lang-switch a { color:var(--muted); text-decoration:none; padding:.1rem .25rem; }
    .lang-switch a.active { color:var(--gold); font-weight:600; }</style>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="lang-switch">
      <a href="?lang=ru" class="{% if locale == 'ru' %}active{% endif %}">RU</a> /
      <a href="?lang=en" class="{% if locale == 'en' %}active{% endif %}">EN</a>
    </div>
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-serif">Rest</span><span class="logo-mono">OS</span>
      </div>
      <p class="auth-subtitle">{{ _("Панель управления сетью ресторанов") }}</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" name="email" placeholder="owner@restaurant.kz" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label>{{ _("Пароль") }}</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="form-group" id="totp-group" style="display:none">
          <label for="totp">{{ _("Код из приложения-аутентификатора") }}</label>
          <input type="text" id="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123 456">
        </div>
        <button type="submit" class="btn-primary btn-full">{{ _("Войти") }}</button>
      </form>
      <p class="auth-subtitle" style="margin-top:1rem">
        <a href="/auth/forgot-password" style="color:var(--gold)">{{ _("Забыли пароль?") }}</a>
      </p>
      <p class="auth-subtitle" style="margin-top:.25rem">
        {{ _("Нет аккаунта?") }} <a href="/auth/register" style="color:var(--gold)">{{ _("Создать") }}</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          totp_code: document.getElementById('totp').value || null,
        }),
        credentials: 'include',
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('access_token', data.access_token);
        location.href = '/dashboard';
      } else {
        let msg = {{ _("Ошибка входа") | tojson }};
        try {
          const data = await res.json();
          msg = data.detail || msg;
          if (data.totp_required) {
            const g = document.getElementById('totp-group');
            const first = g.style.display === 'none';
            g.style.display = '';
            document.getElementById('totp').focus();
            if (first) { err.textContent = msg; err.style.display = 'block'; return; }
          }
        } catch {}
        err.textContent = msg;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
