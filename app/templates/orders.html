{% extends "base.html" %}
{% block title %}{{ _("Заказы") }} — RestOS{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ _("Заказы") }}</h1>
  <div style="display:flex;gap:1rem;align-items:center;">
    <span class="live-badge">● LIVE</span>
    <a href="/kitchen" target="_blank" style="color:var(--muted);font-size:.85rem;text-decoration:none;white-space:nowrap;">{{ _("Экран кухни ↗") }}</a>
    <a href="/pos" class="btn-primary" style="text-decoration:none;">{{ _("+ Новый заказ") }}</a>
  </div>
</div>

<div class="filters">
  <select id="venue-filter" onchange="reloadOrders()" class="select-input">
    <option value="">{{ _("Все заведения") }}</option>
    {% for v in venues %}
    <option value="{{ v.id }}">{{ v.name }}</option>
    {% endfor %}
  </select>
</div>

<div id="orders-board" class="orders-board">
  <div class="loading">{{ _("Загрузка заказов...") }}</div>
</div>

<script>
  function reloadOrders() {
    const venueId = document.getElementById('venue-filter').value;
    const url = '/partials/orders' + (venueId ? '?venue_id=' + venueId : '');
    htmx.ajax('GET', url, {target: '#orders-board', swap: 'innerHTML'});
  }

  reloadOrders();
  setInterval(reloadOrders, 8000);
</script>
{% endblock %}
