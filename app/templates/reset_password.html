<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-192.png">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>{{ _("RestOS — Новый пароль") }}</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/main.css?v=15">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-serif">Rest</span><span class="logo-mono">OS</span>
      </div>
      <p class="auth-subtitle">{{ _("Задайте новый пароль") }}</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>

      <form id="rp-form" class="auth-form">
        <input type="hidden" id="token" value="{{ token }}">
        <div class="form-group">
          <label>{{ _("Новый пароль") }}</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn-primary btn-full">{{ _("Сохранить пароль") }}</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('rp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      const res = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          token: document.getElementById('token').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        location.href = '/auth/login';
      } else {
        let msg = {{ _("Ссылка недействительна или устарела") | tojson }};
        try { const data = await res.json(); msg = data.detail || msg; } catch {}
        err.textContent = msg;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
