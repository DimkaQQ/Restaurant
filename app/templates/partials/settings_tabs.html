<style>
.settings-tabs { display: flex; gap: .25rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; position: relative; z-index: 2; }
.settings-tab {
  padding: .65rem 1rem; font-size: .85rem; color: var(--muted); text-decoration: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s;
  min-height: 36px; display: flex; align-items: center;
}
.settings-tab:hover { color: var(--white); }
.settings-tab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
.settings-tab.hub { color: var(--muted); }
</style>
<div class="settings-tabs">
  <a href="/settings" class="settings-tab hub" title="{{ _('Все настройки') }}">← {{ _("Все настройки") }}</a>
  <a href="/settings/venues" class="settings-tab {% if request.url.path == '/settings/venues' %}active{% endif %}">{{ _("Заведения") }}</a>
  <a href="/settings/tables" class="settings-tab {% if request.url.path == '/settings/tables' %}active{% endif %}">{{ _("Столы") }}</a>
  <a href="/settings/users" class="settings-tab {% if request.url.path == '/settings/users' %}active{% endif %}">{{ _("Пользователи") }}</a>
  <a href="/settings/broadcasts" class="settings-tab {% if request.url.path == '/settings/broadcasts' %}active{% endif %}">{{ _("Рассылки") }}</a>
  <a href="/settings/promos" class="settings-tab {% if request.url.path == '/settings/promos' %}active{% endif %}">{{ _("Промокоды") }}</a>
  <a href="/settings/appearance" class="settings-tab {% if request.url.path == '/settings/appearance' %}active{% endif %}">{{ _("Вид") }}</a>
  {% if user.role == 'owner' %}
  <a href="/settings/audit" class="settings-tab {% if request.url.path == '/settings/audit' %}active{% endif %}">{{ _("Журнал") }}</a>
  <a href="/settings/api-access" class="settings-tab {% if request.url.path == '/settings/api-access' %}active{% endif %}">API</a>
  {% endif %}
  {% if user.role == 'owner' %}
  <a href="/billing" class="settings-tab {% if request.url.path == '/billing' %}active{% endif %}">{{ _("Подписка") }}</a>
  {% endif %}
</div>
