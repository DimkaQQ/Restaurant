events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 20M;
    sendfile on;
    keepalive_timeout 65;

    upstream api {
        server api:8001;
    }

    # Plain HTTP: only serves the certbot ACME challenge (to issue/renew the
    # certificate) and redirects everything else to HTTPS. Without this
    # redirect, cookies never get marked Secure (see app/routers/auth.py's
    # _COOKIE_SECURE check on PUBLIC_URL) and HSTS never activates.
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN;

        # Paths match certbot's default layout — see the setup command below.
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}

# --- One-time HTTPS setup on the VPS (outside Docker, assuming nginx here
# runs as the host's system nginx reverse-proxying to the dockerized api) ---
#
# 1. Point your domain's A record at the VPS IP first (DNS propagation can
#    take a few minutes to hours) — certbot will fail without this.
# 2. Replace YOUR_DOMAIN above with your real domain (e.g. app.restos.kz),
#    then: sudo apt install certbot python3-certbot-nginx
# 3. sudo certbot --nginx -d YOUR_DOMAIN
#    (certbot edits this file in place to wire up the cert paths and adds
#    a renewal cron/systemd timer automatically — the manual ssl_certificate
#    lines above are a reference/fallback if you provision certs another way)
# 4. Set PUBLIC_URL=https://YOUR_DOMAIN in .env and restart the api container
#    so cookies switch to Secure and HSTS activates.
